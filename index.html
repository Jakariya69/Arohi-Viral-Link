<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mim Premium - Official</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <script src="https://niphaumeenses.net/vignette.min.js" data-zone="10530857" data-sdk="show_10530857"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Urbanist:wght@400;700;900&display=swap');
        
        body { font-family: 'Urbanist', sans-serif; background: #f8fafc; user-select: none; margin: 0; overflow-x: hidden; }
        
        /* Page Navigation Logic */
        .sub-page { display: none; padding-bottom: 110px; }
        .sub-page.active { display: block; }
        nav { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: white; display: flex; border-top: 1px solid #f1f5f9; z-index: 1000; padding-bottom: env(safe-area-inset-bottom); }
        .nav-btn { color: #94a3b8; display: flex; flex-direction: column; align-items: center; font-size: 10px; font-weight: 800; gap: 4px; border: none; background: none; flex: 1; }
        .nav-active { color: #7c3aed; }
          
        /* Video Player & Sliders */
        #video-player-section.active { display: flex; }
        .video-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        #slider-wrapper img {
            width: 100%; aspect-ratio: 16/9; object-fit: cover;
            border-radius: 25px; flex-shrink: 0; scroll-snap-align: center;
            border: 2px solid white; box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        /* Support Chat UI */
        #chat-ui { display: none; position: fixed; inset: 0; background: #f8fafc; z-index: 6000; flex-direction: column; }
    </style>
</head>
<body>

<div id="chat-ui">
    <div class="bg-white p-4 border-b flex justify-between items-center shadow-sm">
        <h2 class="font-black text-slate-800 uppercase text-sm">Official Support</h2>
        <button onclick="closeChat()" class="p-2 bg-slate-100 rounded-full"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div id="chat-box" class="flex-1 overflow-y-auto p-4 flex flex-col space-y-2"></div>
    <div class="p-4 bg-white border-t flex gap-2">
        <input id="chat-input" type="text" placeholder="মেসেজ লিখুন..." class="flex-1 bg-slate-100 rounded-2xl p-4 text-sm outline-none font-bold">
        <button onclick="sendMessage()" class="bg-violet-600 text-white p-4 rounded-2xl shadow-lg"><i data-lucide="send" class="w-5 h-5"></i></button>
    </div>
</div>

<div id="video-player-section" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; z-index: 5000; background: #000; flex-direction: column;">
    <div class="w-full p-4 flex justify-between items-center bg-black/90 backdrop-blur-md border-b border-white/5">
        <p class="text-indigo-400 text-[10px] font-black uppercase tracking-[0.2em]">Premium Player</p>
        <button onclick="closeVideo()" class="bg-red-500/20 p-2 rounded-full text-white border border-red-500/30">
            <i data-lucide="x" class="w-4 h-4"></i>
        </button>
    </div>
    
    <div class="video-container relative flex items-center justify-center overflow-hidden" style="width: 100%; aspect-ratio: 16/9; background: radial-gradient(circle, #1e1b4b 0%, #000 100%); border-bottom: 2px solid rgba(255,255,255,0.05);">
        <div class="absolute inset-0 opacity-20 blur-3xl bg-indigo-600"></div>
        <div id="app-watermark" style="position: absolute; color: rgba(255,255,255,0.3); font-size: 11px; font-weight: bold; pointer-events: none; z-index: 9999; transition: all 1.5s ease-in-out;">bdnet24tv | ভিডিও চুরি করা নিষেধ</div>
        <iframe id="dood-player" src="" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; z-index: 10;" allowfullscreen="true" scrolling="no"></iframe>
    </div>

    <div class="w-full px-5 py-6 bg-[#0f172a] shadow-2xl flex-1">
        <h3 id="player-video-title" class="text-white text-[15px] font-black uppercase mb-4 tracking-tight">Loading Title...</h3>
        
        <div class="flex flex-col gap-4">
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-2 bg-emerald-500/10 px-3 py-1.5 rounded-lg border border-emerald-500/20">
                    <div class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse shadow-[0_0_8px_#10b981]"></div>
                    <span id="player-view-count" class="text-[11px] font-black text-emerald-400 uppercase">0 Views</span>
                </div>
                <div class="bg-indigo-600/10 px-3 py-1.5 rounded-lg border border-indigo-500/20 text-[9px] font-black text-indigo-400 uppercase">
                    Premium Quality
                </div>
            </div>

            <button onclick="tg.openLink(window.currentChannelLink || 'https://t.me/your_default')" class="w-full bg-red-600 hover:bg-red-700 text-white py-4 rounded-2xl font-black uppercase flex items-center justify-center gap-2 shadow-lg active:scale-95 transition-all text-[12px]">
                <i data-lucide="youtube" class="w-5 h-5"></i> Subscribe Our Channel
            </button>
        </div>
    </div>
</div>

<div class="sticky top-0 z-50 bg-white">
    <div id="notice-board" class="hidden bg-gradient-to-r from-red-600 to-red-800 text-white py-3 px-4 shadow-lg border-b-2 border-yellow-400">
        <div class="flex items-center gap-3">
            <div class="bg-white/20 p-1.5 rounded-lg animate-pulse"><i data-lucide="megaphone" class="w-4 h-4 text-white"></i></div>
            <div id="notice-text" class="flex-1 font-bold text-[11px] overflow-hidden"></div>
        </div>
    </div>

    <div class="bg-white p-4 border-b flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <img id="u-photo" src="" class="hidden w-10 h-10 rounded-xl border-2 border-violet-600 object-cover">
            <div id="u-initial-box" class="w-10 h-10 bg-violet-600 rounded-xl flex items-center justify-center text-white font-black text-sm">?</div>
            <div>
                <h1 class="font-black text-transparent bg-clip-text bg-gradient-to-r from-violet-600 to-fuchsia-600 text-xl italic leading-none">MIM PREMIUM</h1>
                <p id="top-username" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Loading...</p>
            </div>
        </div>
        <button onclick="supportWithAd()" class="bg-violet-100 p-2 rounded-xl text-violet-600"><i data-lucide="headphones" class="w-6 h-6"></i></button>
    </div>

    <div class="px-4 py-3 bg-white border-b shadow-sm">
        <div class="relative">
            <input type="text" id="videoSearch" onkeyup="searchVideo()" placeholder="ভিডিও বা এপিসোড খুঁজুন..." class="w-full bg-slate-100 border-none p-3 pl-10 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-violet-200">
            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4"></i>
        </div>
    </div>
</div>

<div id="pages-container" class="p-4">
    
    <div id="home-page" class="sub-page active">
        <div class="mb-6 px-1">
            <div id="home-slider-container" class="relative w-full overflow-hidden">
                <div id="slider-wrapper" class="flex overflow-x-auto snap-x snap-mandatory no-scrollbar gap-4 pb-2"></div>
            </div>
        </div>
        
        <div class="bg-white p-4 rounded-2xl border mb-4 flex gap-3">
            <div class="flex-1 bg-indigo-600 p-4 rounded-2xl text-white shadow-lg">
                <p class="text-[9px] font-bold opacity-70 uppercase">BALANCE</p>
                <p class="text-xl font-black">৳<span id="display-balance">0.00</span></p>
            </div>
            <div class="flex-1 bg-slate-50 border p-4 rounded-2xl text-center">
                <p class="text-[9px] font-bold text-slate-400 uppercase">Status</p>
                <p class="text-[11px] font-black text-slate-800"><span id="vid-watch-count">0</span> Videos</p>
            </div>
        </div>
        
        <div id="episode-list" class="space-y-3"></div>
    </div>

    <div id="task-page" class="sub-page">
        <p class="text-[10px] font-black text-slate-400 uppercase text-center mb-4">Complete Tasks & Earn</p>
        <button onclick="tg.openLink('https://omg10.com/4/10535907')" class="w-full bg-violet-600 text-white py-4 rounded-2xl font-black uppercase shadow-lg mb-4 flex items-center justify-center gap-2">
            🚀 Click to get Bonus Point (AD)
        </button>
        <button onclick="tg.openLink('https://omg10.com/4/10535907')" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black uppercase shadow-lg mb-4 flex items-center justify-center gap-2">
            💎 Watch Video & Earn More (AD)
        </button>
        <div id="social-list" class="space-y-3"></div>
    </div>

    <div id="leader-page" class="sub-page">
        <div id="leader-list-box" class="bg-white rounded-[30px] border overflow-hidden shadow-sm"></div>
    </div>

    <div id="refer-page" class="sub-page">
        <div class="bg-blue-600 p-8 rounded-[30px] text-center text-white shadow-xl">
            <p class="font-black text-4xl mb-1">৳30</p>
            <p class="text-[10px] opacity-80 mb-6 uppercase">Per Referral</p>
            <div id="ref-link-display" class="bg-black/20 p-4 rounded-xl text-[9px] font-mono mb-4 break-all">Loading...</div>
            <button onclick="copyRef()" class="w-full bg-white text-blue-700 py-4 rounded-2xl font-black text-xs uppercase">Copy Link</button>
        </div>
    </div>

    <div id="profile-page" class="sub-page">
        <div class="bg-white p-6 rounded-[30px] border shadow-sm mb-4">
            <h3 class="font-black text-slate-800 text-sm mb-4 uppercase flex items-center gap-2"><i data-lucide="wallet"></i> Withdraw</h3>
            <div class="flex gap-2 mb-4">
                <button onclick="setMethod('Bkash')" class="pay-method flex-1 border-2 border-slate-100 p-3 rounded-2xl flex flex-col items-center gap-1 active:scale-95 transition-all">
                    <span class="text-[10px] font-black uppercase text-pink-600">Bkash</span>
                </button>
                <button onclick="setMethod('Nagad')" class="pay-method flex-1 border-2 border-slate-100 p-3 rounded-2xl flex flex-col items-center gap-1 active:scale-95 transition-all">
                    <span class="text-[10px] font-black uppercase text-orange-500">Nagad</span>
                </button>
            </div>
            <div id="ref-warning" class="bg-red-50 p-4 rounded-2xl mb-4 text-red-600 text-[10px] font-black uppercase">
                🔒 LOCK: Need 20 Ref & 10 Video.
            </div>
            <input type="number" id="w-amt" placeholder="Amount (Min 100)" class="w-full p-4 bg-slate-50 rounded-2xl mb-3 outline-none font-bold text-sm">
            <input type="number" id="w-num" placeholder="Your Number" class="w-full p-4 bg-slate-50 rounded-2xl mb-4 outline-none font-bold text-sm">
            <button id="withdraw-btn" onclick="handleWithdraw()" class="w-full bg-slate-200 text-slate-400 py-4 rounded-2xl font-black uppercase shadow-md" disabled>
                Withdraw Locked
            </button>
        </div>
        
        <div class="bg-white p-5 rounded-[30px] border shadow-sm space-y-3">
            <h3 class="font-black text-slate-800 text-xs mb-2 uppercase flex items-center gap-2"><i data-lucide="help-circle"></i> Support & Help</h3>
            <button onclick="supportWithAd()" class="w-full flex items-center justify-between p-3 bg-violet-50 rounded-2xl border border-violet-100">
                <span class="text-[11px] font-black text-slate-700 uppercase">Live Chat Support</span>
                <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
            </button>
        </div>
    </div>
</div>

<nav>
    <button onclick="changePage('home-page', this)" class="nav-btn nav-active"><i data-lucide="play"></i>Videos</button>
    <button onclick="changePage('task-page', this)" class="nav-btn"><i data-lucide="globe"></i>Tasks</button>
    <button onclick="changePage('leader-page', this)" class="nav-btn"><i data-lucide="trophy"></i>Leaders</button>
    <button onclick="changePage('refer-page', this)" class="nav-btn"><i data-lucide="users"></i>Refer</button>
    <button onclick="changePage('profile-page', this)" class="nav-btn"><i data-lucide="wallet"></i>Wallet</button>
</nav>

<script>
    const tg = window.Telegram.WebApp; 
    tg.expand();

    // Firebase Initialization
    const firebaseConfig = { 
        apiKey: "AIzaSyCpNJm6i8cH6GNI5j2XQAiUgU7q-97c150", 
        databaseURL: "https://mini-app-link-default-rtdb.firebaseio.com" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const user = tg.initDataUnsafe?.user || { id: "0000", first_name: "Guest" };
    const userId = "TG-" + user.id;
    let userData = { balance: 0, refCount: 0, videosWatched: 0 };
    let selectedMethod = "";
    let slideInterval;
    let currentSlide = 0;

        function init() {
        // ১. স্লাইডার ইমেজ লোড এবং অটো-স্লাইড সেটআপ
        db.ref('app_config/sliders').on('value', s => {
            const wrapper = document.getElementById('slider-wrapper');
            if(s.exists() && wrapper) {
                const imgs = s.val();
                // এখানে class গুলো যোগ করা হয়েছে যাতে ইমেজগুলো ঠিকমতো স্লাইড হয়
                wrapper.innerHTML = `
                    <img src="${imgs.img1 || ''}" class="w-full aspect-video rounded-3xl object-cover shrink-0 snap-center" onerror="this.style.display='none'">
                    <img src="${imgs.img2 || ''}" class="w-full aspect-video rounded-3xl object-cover shrink-0 snap-center" onerror="this.style.display='none'">
                    <img src="${imgs.img3 || ''}" class="w-full aspect-video rounded-3xl object-cover shrink-0 snap-center" onerror="this.style.display='none'">
                    <img src="${imgs.img4 || ''}" class="w-full aspect-video rounded-3xl object-cover shrink-0 snap-center" onerror="this.style.display='none'">
                `;
                setupAutoSlider();
            }
        });

        // ইউজার সেটাআপ এবং অনলাইন স্ট্যাটাস
        if (user.id !== "0000") {
            const userRef = db.ref('user_activity/' + userId);
            userRef.once('value', snapshot => {
                if (!snapshot.exists()) {
                    userRef.set({
                        name: (user.first_name || "") + " " + (user.last_name || ""),
                        first_name: user.first_name || "",
                        username: user.username || "",
                        balance: 0, videosWatched: 0, refCount: 0,
                        joined_at: firebase.database.ServerValue.TIMESTAMP
                    });
                }
            });
        }

        setInterval(() => {
            if (user.id !== "0000") db.ref('user_activity/' + userId).update({ last_seen: firebase.database.ServerValue.TIMESTAMP });
        }, 30000); 

        // বাকি ডাটা লোড
        db.ref('app_config/channel_link').on('value', s => window.currentChannelLink = s.exists() ? s.val() : "");
        
        db.ref('notice').on('value', s => {
            const noticeBoard = document.getElementById('notice-board');
            const noticeText = document.getElementById('notice-text');
            if(s.exists() && s.val() !== "") {
                noticeBoard.classList.remove('hidden');
                noticeText.innerHTML = `<marquee behavior="scroll" direction="left" scrollamount="5" class="font-black text-xs uppercase">${s.val()}</marquee>`;
            } else {
                noticeBoard.classList.add('hidden');
            }
        });

        db.ref('user_activity/' + userId).on('value', snap => {
            userData = snap.val() || { balance: 0, refCount: 0, videosWatched: 0, name: user.first_name };
            updateUI();
        });

        loadContent(); 
        loadLeaderboard();
        lucide.createIcons();
    }

    // স্লাইডার লজিক (এটি অটোমেটিক স্লাইড করবে)
    function setupAutoSlider() {
        const sliderWrapper = document.getElementById('slider-wrapper');
        if (!sliderWrapper) return;

        clearInterval(slideInterval);
        
        function autoSlide() {
            const images = sliderWrapper.getElementsByTagName('img');
            let visibleImages = Array.from(images).filter(img => img.style.display !== 'none');
            
            if (visibleImages.length > 0) {
                currentSlide++;
                if (currentSlide >= visibleImages.length) {
                    currentSlide = 0;
                }
                
                const slideWidth = visibleImages[0].clientWidth + 16; 
                sliderWrapper.scrollTo({
                    left: slideWidth * currentSlide,
                    behavior: 'smooth'
                });
            }
        }

        slideInterval = setInterval(autoSlide, 3000);

        sliderWrapper.addEventListener('touchstart', () => clearInterval(slideInterval));
        sliderWrapper.addEventListener('touchend', () => {
            slideInterval = setInterval(autoSlide, 3000);
        });
    }


    function updateUI() {
        if(document.getElementById('top-username')) document.getElementById('top-username').innerText = userData.name || user.first_name || "User";
        if(document.getElementById('display-balance')) document.getElementById('display-balance').innerText = (userData.balance || 0).toFixed(2);
        if(document.getElementById('vid-watch-count')) document.getElementById('vid-watch-count').innerText = userData.videosWatched || 0;

        const uPhoto = document.getElementById('u-photo');
        const uInitial = document.getElementById('u-initial-box');
        
        if(userData.image || user.photo_url) {
            uPhoto.src = userData.image || user.photo_url;
            uPhoto.classList.remove('hidden');
            if(uInitial) uInitial.classList.add('hidden');
        }

        const refBox = document.getElementById('ref-link-display');
        if(refBox) refBox.innerText = `https://t.me/arohimimvirallinkjk_bot?start=${user.id}`;

        const wBtn = document.getElementById('withdraw-btn');
        const wWarn = document.getElementById('ref-warning');
        
        if(userData.refCount >= 20 && (userData.videosWatched || 0) >= 10) {
            if(wBtn) { wBtn.disabled = false; wBtn.className = "w-full bg-green-600 text-white py-4 rounded-2xl font-black uppercase shadow-md active:scale-95"; wBtn.innerText = "Withdraw Now ✅"; }
            if(wWarn) wWarn.classList.add('hidden');
        } else {
            if(wBtn) { wBtn.disabled = true; wBtn.className = "w-full bg-slate-200 text-slate-400 py-4 rounded-2xl font-black uppercase shadow-md"; wBtn.innerText = "Withdraw Locked 🔒"; }
            if(wWarn) wWarn.classList.remove('hidden');
        }
    }

        function loadContent() {
        // ১. ভিডিও লিস্ট লোড করার লজিক
        db.ref('tasks').on('value', snap => {
            const list = document.getElementById('episode-list'); 
            if(!list) return; 
            list.innerHTML = ""; // আগের লিস্ট ক্লিয়ার করবে
            
            let adData = JSON.parse(localStorage.getItem('ad_progress_data')) || {};
            let today = new Date().toDateString();
            
            let videos = [];
            
            // ডাটাবেস থেকে সব ভিডিও প্রথমে একটি লিস্টে আনবে
            snap.forEach(child => {
                videos.push({ key: child.key, val: child.val() });
            });

            // ২. এই লাইনটির মাধ্যমে শেষের ভিডিও (নতুন ভিডিও) একদম উপরে চলে আসবে
            videos.reverse();

            // ৩. এবার ভিডিওগুলো স্ক্রিনে দেখাবে
            videos.forEach(item => {
                const v = item.val; 
                const k = item.key;
                const views = v.views || 0; 
                const requiredAds = v.adLimit || 5; 
                let currentCount = (adData[k] && adData[k].date === today) ? adData[k].count : 0;

                // বাটনের ডিজাইন এবং লজিক
                let btnHtml = currentCount >= requiredAds 
                    ? `<button onclick="unlockStep('${k}', '${v.url}', ${requiredAds})" class="w-full bg-green-500 text-white py-4 rounded-2xl text-[12px] font-black uppercase shadow-lg active:scale-95 transition-all">PLAY VIDEO NOW ✅</button>`
                    : `<button onclick="unlockStep('${k}', '${v.url}', ${requiredAds})" class="w-full bg-indigo-600 text-white py-4 rounded-2xl text-[12px] font-black uppercase shadow-lg active:scale-95 transition-all">UNLOCK VIDEO (${currentCount}/${requiredAds} Ads) 🔒</button>`;

                list.innerHTML += `
                <div class="video-card-item bg-white p-4 rounded-3xl flex flex-col gap-3 border border-slate-100 shadow-sm mb-4">
                    <div class="flex items-center gap-4">
                        <div class="relative">
                            <img src="${v.image || 'https://via.placeholder.com/150'}" class="w-24 h-20 rounded-2xl object-cover shadow-md border-2 border-slate-50">
                            <div class="absolute bottom-1 right-1 bg-black/60 text-white text-[8px] px-1.5 py-0.5 rounded-md flex items-center gap-1">
                                👁️ ${views}
                            </div>
                        </div>
                        <div class="flex-1">
                            <h4 class="video-title text-[13px] font-black text-slate-800 uppercase leading-tight">${v.title || v.name || 'Premium Video'}</h4>
                            <div class="flex items-center gap-2 mt-1">
                                <p class="text-[10px] text-slate-400 font-bold">Status: ${currentCount >= requiredAds ? 'Ready ✅' : 'Locked 🔒'}</p>
                            </div>
                        </div>
                    </div>
                    ${btnHtml}
                </div>`;
            });
            
            // আইকনগুলো লোড করবে
            if(typeof lucide !== 'undefined') lucide.createIcons();
        });

        // ৪. সোশ্যাল টাস্ক লোড করার লজিক
        db.ref('social_tasks').on('value', snap => {
            const list = document.getElementById('social-list'); 
            if(!list) return; 
            list.innerHTML = "";
            snap.forEach(child => {
                const t = child.val();
                list.innerHTML += `<div class="bg-white p-4 rounded-2xl flex justify-between items-center border border-slate-50 shadow-sm mb-3">
                    <div>
                        <p class="text-[11px] font-black text-slate-800 uppercase">${t.name}</p>
                        <p class="text-[10px] text-green-500 font-bold">Reward: ৳${t.reward}</p>
                    </div>
                    <button onclick="tg.openLink('${t.link}')" class="bg-slate-900 text-white px-6 py-2.5 rounded-xl text-[10px] font-black uppercase">Visit</button>
                </div>`;
            });
        });
    }


    function unlockStep(k, url, requiredAds) {
        let adData = JSON.parse(localStorage.getItem('ad_progress_data')) || {};
        let today = new Date().toDateString();
        if (!adData[k] || adData[k].date !== today) adData[k] = { count: 0, date: today };

        if (adData[k].count < requiredAds) {
            if (typeof show_10530857 === 'function') {
                show_10530857();
                setTimeout(() => {
                    adData[k].count++;
                    localStorage.setItem('ad_progress_data', JSON.stringify(adData));
                    loadContent(); 
                }, 2000); 
            }
        } else {
            db.ref('tasks/' + k).once('value', snapshot => {
                const data = snapshot.val();
                if(data) {
                    document.getElementById('player-video-title').innerText = data.title || data.name || "Premium Video";
                    document.getElementById('player-view-count').innerText = (data.views || 0) + " Views";
                }
            });

            db.ref('tasks/' + k + '/views').transaction(c => (c || 0) + 1);
            
            const iframe = document.getElementById('dood-player');
            if(iframe) {
                iframe.src = url;
                document.getElementById('video-player-section').style.display = 'flex';
                document.getElementById('video-player-section').classList.add('active');
                startAppWatermark();
            }
        }
    }

    function closeVideo() { 
        const iframe = document.getElementById('dood-player');
        if(iframe) iframe.src = ""; 
        document.getElementById('video-player-section').style.display = 'none';
        document.getElementById('video-player-section').classList.remove('active');
    }

    function startAppWatermark() {
        const wm = document.getElementById('app-watermark');
        const container = document.querySelector('.video-container');
        if(!wm || !container) return;
        setInterval(() => {
            wm.style.left = Math.random() * (container.offsetWidth - 120) + 'px';
            wm.style.top = Math.random() * (container.offsetHeight - 40) + 'px';
        }, 3000);
    }

    function changePage(id, el) {
        document.querySelectorAll('.sub-page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('nav-active'));
        if(el) el.classList.add('nav-active'); lucide.createIcons();
    }

    function copyRef() {
        const text = document.getElementById('ref-link-display').innerText;
        navigator.clipboard.writeText(text).then(() => showToast("Referral Link Copied!")).catch(err => alert("Link Copied!"));
    }

    function setMethod(method) {
        selectedMethod = method;
        document.querySelectorAll('.pay-method').forEach(b => {
            b.style.borderColor = '#f1f5f9'; b.style.background = 'white';
        });
        event.currentTarget.style.borderColor = '#7c3aed';
        event.currentTarget.style.background = '#f5f3ff';
    }

    function handleWithdraw() {
        const amount = parseFloat(document.getElementById('w-amt').value);
        const number = document.getElementById('w-num').value;

        if(!selectedMethod) return showToast("বিকাশ নাকি নগদ সিলেক্ট করুন!"); 
        if(!amount || !number) return showToast("সবগুলো ঘর পূরণ করুন!");
        if(amount < 100) return showToast("ন্যূনতম ১০০ টাকা হতে হবে।");
        if(amount > userData.balance) return showToast("আপনার ব্যালেন্স পর্যাপ্ত নয়!");

        db.ref('withdrawals').push({
            userId: userId, amount: amount, number: number, method: selectedMethod, 
            status: "pending", name: user.first_name, time: firebase.database.ServerValue.TIMESTAMP 
        }).then(() => {
            db.ref('user_activity/' + userId).update({ balance: userData.balance - amount });
            showToast("উইথড্র রিকোয়েস্ট সফল হয়েছে!");
            document.getElementById('w-amt').value = ""; document.getElementById('w-num').value = "";
            selectedMethod = ""; 
            document.querySelectorAll('.pay-method').forEach(b => { b.style.borderColor = '#f1f5f9'; b.style.background = 'white'; });
        });
    }

    function searchVideo() {
        let input = document.getElementById('videoSearch').value.toUpperCase();
        let cards = document.getElementsByClassName('video-card-item');
        for (let i = 0; i < cards.length; i++) {
            let titleElement = cards[i].querySelector('.video-title');
            if (titleElement) cards[i].style.display = titleElement.innerText.toUpperCase().indexOf(input) > -1 ? "" : "none";
        }
    }

    function loadLeaderboard() {
        db.ref('user_activity').orderByChild('balance').limitToLast(10).once('value', s => {
            const box = document.getElementById('leader-list-box'); 
            if(!box) return;
            box.innerHTML = `<div class="bg-gradient-to-r from-violet-600 to-indigo-600 p-6 text-white text-center">
                <h2 class="font-black uppercase italic tracking-wider">Top Earners</h2>
                <p class="text-[10px] opacity-80">আমাদের সেরা ১০ জন ইনকামার</p>
            </div>`;
            let arr = []; 
            s.forEach(c => arr.push(c.val()));
            arr.reverse().forEach((u, i) => {
                let medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : "#" + (i + 1);
                box.innerHTML += `
                <div class="p-4 flex justify-between border-b border-slate-50 items-center hover:bg-slate-50 transition-all">
                    <div class="flex items-center gap-3">
                        <span class="text-lg font-black w-8">${medal}</span>
                        <div>
                            <p class="text-[11px] font-black text-slate-800 uppercase">${u.name || 'Anonymous'}</p>
                            <p class="text-[9px] text-slate-400 font-bold">${u.videosWatched || 0} Videos Watched</p>
                        </div>
                    </div>
                    <span class="bg-emerald-50 text-emerald-600 px-4 py-1.5 rounded-xl text-[10px] font-black shadow-sm">৳${(u.balance || 0).toFixed(2)}</span>
                </div>`;
            });
        });
    }

    db.ref('support_chats/' + userId).on('value', snap => {
        const box = document.getElementById('chat-box'); if(!box) return; box.innerHTML = "";
        snap.forEach(m => {
            const d = m.val();
            const style = d.sender === 'user' ? 'bg-violet-600 text-white self-end' : 'bg-slate-200 text-slate-800 self-start';
            box.innerHTML += `<div class="${style} p-3 mb-2 rounded-2xl text-[11px] font-bold max-w-[80%]">${d.text}</div>`;
        });
        box.scrollTop = box.scrollHeight;
    });

    function showToast(msg) {
        const old = document.querySelector(".custom-toast"); if(old) old.remove();
        const toast = document.createElement("div"); toast.className = "custom-toast"; toast.innerHTML = msg;
        toast.style.cssText = `position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 12px 24px; border-radius: 16px; font-size: 13px; font-weight: bold; z-index: 10000; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2);`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }

    function closeChat() { document.getElementById('chat-ui').style.display = 'none'; }
    function supportWithAd() { document.getElementById('chat-ui').style.display = 'flex'; }

    // Start App
    init();
    lucide.createIcons();

</script>
</body>
</html>
